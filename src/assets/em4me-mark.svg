<!--
  EM4me-Kompaktmarke fuer die kleinen Icon-Stufen (16/24/32 px).
  4T-0649 (Epic 3E-0126): Das vollstaendige Logo (em4me-logo.svg) traegt vier
  Buchstaben und eine Ziffer; bei 16 px zerfallen die Buchstaben zu Grau. Diese
  Fassung fuehrt allein die Vier und reduziert E, M, m und e auf Punkte an ihren
  angestammten Ecken-Positionen. Drei Anpassungen gegenueber dem Original halten
  die Ziffer auch bei 16 px lesbar:
    1. Die Striche sind verstaerkt (Kontur in Fuellfarbe auf demselben Pfad),
       damit der duenne Querbalken der Antiqua-Ziffer nicht wegbricht.
    2. Ziffer, Punkte und Rahmen stehen dunkler (#5A4200 statt #7F6000).
    3. Der Gold-Verlauf ist abgeflacht; im Original wird er unten so dunkel,
       dass der Kontrast zur Ziffer genau dort verloren geht.
  Der Ziffern-Pfad stammt unveraendert aus dem Original-Logo; nur Groesse,
  Lage und Strichstaerke sind angepasst. Vom Paket ausgeschlossen: reine
  Quelldatei fuer `npm run build:icon`.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="600"
  height="600"
  viewBox="0 0 600 600"
  role="img"
  aria-labelledby="em4me-mark-title"
>
  <title id="em4me-mark-title">EM4me</title>
  <defs>
    <linearGradient id="em4me-mark-gold" x1="0" y1="16" x2="0" y2="583" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD964" />
      <stop offset="50%" stop-color="#FFC93C" />
      <stop offset="100%" stop-color="#E8B300" />
    </linearGradient>
  </defs>
  <path
    fill="#5A4200"
    d="M101 6H499C551 6 593 48 593 100V499C593 551 551 593 499 593H101C49 593 7 551 7 499V100C7 48 49 6 101 6Z"
  />
  <path
