<!--
  EM4me-Logo, vollstaendige Bildmarke. Eigengestaltung des Product Owners.
  4T-000649 (Epic 3E-000126): Quelle fuer die grossen Icon-Stufen (ab 48 px),
  fuer den Ueber-Dialog und fuer die Handbuch-Ueberblicksseite. Die kleinen
  Icon-Stufen nutzen stattdessen em4me-mark.svg, weil die Buchstaben dort
  nicht mehr lesbar waeren.
  Gegenueber der Vorlage aus der PowerPoint-Ableitung nur eine Aenderung:
  die Verlaufs-Kennung heisst em4me-gold statt gold, damit das Logo inline
  in eine HTML-Seite eingebettet werden kann, ohne mit fremden Kennungen zu
  kollidieren.
-->
